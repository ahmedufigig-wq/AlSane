<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مخزني</title>
<style>
:root{--gold:#d9ad4c;--bg:#eef3f5;--panel:#ffffff;--muted:#637381;--line:#d9e2e7;--ink:#183747;--teal:#087f8c;--teal2:#075b68}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif;padding-bottom:85px}
header{background:linear-gradient(130deg,#123746,#087f8c);padding:18px 16px;border-bottom:3px solid #d9ad4c;display:flex;align-items:center;gap:12px}
header img{width:58px;height:58px;object-fit:cover;border-radius:14px;border:1px solid var(--gold)}
h1{font-size:24px;color:#fff;margin:0}header small{color:#d9edf0}
main{padding:14px;max-width:760px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #18374710}
.card small{color:var(--muted)}.num{font-size:22px;color:var(--teal);font-weight:bold;margin-top:8px}
h2{font-size:18px;color:var(--teal);margin:8px 0 14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#123746;border-top:2px solid #d9ad4c;display:flex;overflow-x:auto;z-index:3}
nav button{background:none;border:0;color:#d9edf0;padding:12px 13px;min-width:75px;font-size:12px}
nav button.active{color:#fff;background:#087f8c}
button,.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:bold}
input,select{width:100%;padding:12px;margin:6px 0 12px;background:#f8fbfc;border:1px solid #c6d5dc;color:#183747;border-radius:8px;font-size:16px}
label{color:#315768;font-size:13px}form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}form .wide{grid-column:1/-1}
.item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}
.item:last-child{border:0}.muted{color:var(--muted);font-size:12px}.danger{background:#713333;color:white}.good{color:#087f57;font-weight:bold}
.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{color:var(--muted);text-align:center;padding:20px}
@media(max-width:390px){form{grid-template-columns:1fr}.cards{gap:7px}.card{padding:10px}}
.backbar{display:flex;justify-content:flex-start;margin:0 0 12px}.backbar button{background:#123746;border:1px solid #d9ad4c;padding:10px 16px}.backbar button:active{opacity:.8}</style></head><body>
<header><img src="logo.svg" alt="شعار مخزني" style="width:64px;height:64px;object-fit:contain;border-radius:14px;border:1px solid var(--gold)"><div><h1>مخزني</h1><small>إدارة شاملة لبقالتك • يعمل دون إنترنت</small></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const tabs=[['home','الرئيسية'],['sales','المبيعات'],['products','المخزون'],['purchases','المشتريات'],['debts','الزبائن'],['suppliers','الموردون'],['expenses','المصروفات'],['cash','الصندوق'],['reports','التقارير'],['settings','الإعدادات']];
function safeReadJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback;}catch(err){console.error('Storage parse error:',key,err);return fallback;}}
let db=safeReadJSON('alsane_db',{"products":[],"sales":[],"debts":[],"suppliers":[],"expenses":[]});
if(!db||typeof db!=='object'||Array.isArray(db))db={"products":[],"sales":[],"debts":[],"suppliers":[],"expenses":[]};
for(const key of ['products','sales','debts','suppliers','expenses'])if(!Array.isArray(db[key]))db[key]=[];
let page='home';const save=()=>localStorage.setItem(activeAccountId?'alsane_db_'+activeAccountId:'alsane_db',JSON.stringify(db));
db.debts=db.debts.map(d=>({...d,amount:Number(d.amount)||0,paid:Number(d.paid)||0,remaining:Number(d.remaining??((Number(d.amount)||0)-(Number(d.paid)||0))),payments:Array.isArray(d.payments)?d.payments:[]}));
db.suppliers=db.suppliers.map(s=>({...s,originalAmount:Number(s.originalAmount??s.amount)||0,paid:Number(s.paid)||0,remaining:Number(s.remaining??s.amount)||0,payments:Array.isArray(s.payments)?s.payments:[]}));
db.purchases=db.purchases||[];db.cash=db.cash||[];db.settings=db.settings||{};db.products=db.products.map(p=>({...p,barcode:p.barcode||'',expiry:p.expiry||''}));save();
let selectedIndex=0;
function editCustomer(i){selectedIndex=i;page='editDebt';render()}
function recordCustomerPayment(i){selectedIndex=i;page='payDebt';render()}
function editSupplier(i){selectedIndex=i;page='editSupplier';render()}
function recordSupplierPayment(i){selectedIndex=i;page='paySupplier';render()}
function editForm(kind){let isDebt=kind==='debt',obj=isDebt?db.debts[selectedIndex]:db.suppliers[selectedIndex],title=isDebt?'تعديل حساب الزبون':'تعديل حساب المورد';if(!obj)return '<section class="panel">الحساب غير موجود<button onclick="go(\''+(isDebt?'debts':'suppliers')+'\')">رجوع</button></section>';return '<section class="panel"><h2>'+title+'</h2><form id="editEntry">'+field('name','الاسم')+(isDebt?'':field('phone','رقم الهاتف'))+field('amount',isDebt?'إجمالي الدين':'إجمالي المستحق','number')+field('paid',isDebt?'إجمالي المسدد':'إجمالي المدفوع','number')+'<div class="wide actions"><button type="submit">حفظ التعديلات</button><button type="button" class="danger" onclick="go(\''+(isDebt?'debts':'suppliers')+'\')">إلغاء</button></div></form></section>'}
function paymentForm(kind){let isDebt=kind==='debt',obj=isDebt?db.debts[selectedIndex]:db.suppliers[selectedIndex];if(!obj)return '';return '<section class="panel"><h2>'+(isDebt?'تسجيل سداد من الزبون':'تسجيل دفعة للمورد')+'</h2><p>الرصيد المتبقي: <b>'+money(obj.remaining)+'</b></p><form id="paymentEntry">'+field('amount','مبلغ الدفعة','number')+field('date','تاريخ الدفعة','date')+'<div class="wide actions"><button type="submit">تأكيد الدفعة</button><button type="button" class="danger" onclick="go(\''+(isDebt?'debts':'suppliers')+'\')">إلغاء</button></div></form></section>'}

const money=n=>(Number(n)||0).toLocaleString('ar-EG')+' ر.ي';
const sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(page===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')}
function go(p){page=p;render()}
function field(name,label,type='text',required=true){return '<div><label>'+label+'</label><input name="'+name+'" type="'+type+'" '+(required?'required':'')+'></div>'}
function list(arr){if(!arr.length)return '<div class="empty">لا توجد بيانات بعد</div>';return arr.slice().reverse().map(x=>'<div class="item"><div><b>'+(x.name||x.product||x.note||'عملية')+'</b><div class="muted">'+(x.date||'')+' '+(x.detail||'')+'</div></div><div><b>'+money(x.amount||x.total||0)+'</b></div></div>').join('')}
function dashboard(){let sales=sum(db.sales,'total'),cost=sum(db.sales,'cost'),expenses=sum(db.expenses,'amount'),debts=sum(db.debts,'remaining');return '<div class="cards"><div class="card"><small>إجمالي المبيعات</small><div class="num">'+money(sales)+'</div></div><div class="card"><small>الربح قبل المصروفات</small><div class="num">'+money(sales-cost)+'</div></div><div class="card"><small>المصروفات</small><div class="num">'+money(expenses)+'</div></div><div class="card"><small>ديون الزبائن المتبقية</small><div class="num">'+money(debts)+'</div></div></div><section class="panel"><h2>مرحباً بك في مخزني</h2><p>سجّل مبيعاتك وديونك ومصروفاتك، وسيتولى التطبيق ترتيب الحسابات محلياً على هاتفك.</p><div class="actions"><button onclick="go(\'sales\')">تسجيل بيع</button><button onclick="go(\'products\')">إضافة صنف</button><button onclick="go(\'debts\')">إضافة دين</button></div></section><section class="panel"><h2>آخر المبيعات</h2>'+list(db.sales)+'</section>'}
function formPage(title,desc,fields,button){return '<section class="panel"><h2>'+title+'</h2><p class="muted">'+desc+'</p><form id="entry">'+fields+'<div class="wide"><button type="submit">'+button+'</button></div></form></section>'}
function products(){return formPage('إضافة صنف','أدخل سعر الشراء والبيع والكمية.',field('name','اسم الصنف')+field('buy','سعر الشراء','number')+field('sell','سعر البيع','number')+field('qty','الكمية','number'),'حفظ الصنف')+'<section class="panel"><h2>قائمة الأصناف ('+db.products.length+')</h2>'+(db.products.map(p=>'<div class="item"><div><b>'+p.name+'</b><div class="muted">شراء '+money(p.buy)+' • بيع '+money(p.sell)+' • كمية '+p.qty+'</div></div></div>').join('')||'<div class="empty">لا توجد أصناف</div>')+'</section>'}
function sales(){return formPage('تسجيل عملية بيع','سجّل البيع يدوياً، وسيحسب التطبيق الربح.',field('name','اسم المنتج أو تفاصيل البيع')+field('total','إجمالي البيع','number')+field('cost','تكلفة البضاعة','number')+field('date','التاريخ','date'),'حفظ البيع')+'<section class="panel"><h2>سجل المبيعات</h2>'+list(db.sales)+'</section>'}
function debts(){return formPage('إضافة دين زبون','أدخل إجمالي الدين وما سدده الزبون حتى الآن.',field('name','اسم الزبون')+field('amount','إجمالي الدين','number')+field('paid','المبلغ المسدد','number')+field('date','التاريخ','date'),'حفظ الدين')+'<section class="panel"><h2>حسابات الزبائن</h2>'+(db.debts.map((d,i)=>'<div class="item"><div style="flex:1"><b>'+d.name+'</b><div class="muted">الدين: '+money(d.amount)+' • المسدد: '+money(d.paid)+'</div><div class="good">المتبقي على الزبون: '+money(d.remaining)+'</div><div class="actions" style="margin-top:8px"><button onclick="recordCustomerPayment('+i+')">تسجيل سداد</button><button onclick="editCustomer('+i+')">تعديل الحساب</button></div>'+(d.payments||[]).map(p=>'<div class="muted">دفعة '+money(p.amount)+' • '+p.date+'</div>').join('')+'</div></div>').join('')||'<div class="empty">لا توجد ديون مسجلة</div>')+'</section>'}
function suppliers(){return formPage('إضافة مورد','أدخل إجمالي المبلغ الذي عليك للمورد وما دفعته له.',field('name','اسم المورد')+field('phone','رقم الهاتف')+field('amount','إجمالي المستحق','number')+field('paid','المبلغ المدفوع','number'),'حفظ المورد')+'<section class="panel"><h2>حسابات الموردين</h2>'+(db.suppliers.map((s,i)=>'<div class="item"><div style="flex:1"><b>'+s.name+'</b><div class="muted">'+(s.phone||'')+' • الإجمالي: '+money(s.originalAmount)+' • المدفوع: '+money(s.paid)+'</div><div class="good">المتبقي عليك للمورد: '+money(s.remaining)+'</div><div class="actions" style="margin-top:8px"><button onclick="recordSupplierPayment('+i+')">تسجيل دفعة</button><button onclick="editSupplier('+i+')">تعديل الحساب</button></div>'+(s.payments||[]).map(p=>'<div class="muted">دفعت '+money(p.amount)+' • '+p.date+'</div>').join('')+'</div></div>').join('')||'<div class="empty">لا يوجد موردون</div>')+'</section>'}
function expenses(){return formPage('تسجيل مصروف','مثل الإيجار والكهرباء والنقل والأجور.',field('note','نوع المصروف')+field('amount','المبلغ','number')+field('date','التاريخ','date'),'حفظ المصروف')+'<section class="panel"><h2>سجل المصروفات</h2>'+list(db.expenses)+'</section>'}
function reports(){let sales=sum(db.sales,'total'),cost=sum(db.sales,'cost'),expenses=sum(db.expenses,'amount'),debts=sum(db.debts,'remaining');return '<section class="panel"><h2>ملخص الحسابات</h2>'+[['إجمالي المبيعات',sales],['تكلفة البضاعة المباعة',cost],['الربح الإجمالي',sales-cost],['المصروفات',expenses],['صافي الربح التقديري',sales-cost-expenses],['ديون الزبائن',debts]].map(x=>'<div class="item"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'<p class="muted">هذه التقارير مبنية على العمليات التي سجلتها داخل التطبيق.</p><button onclick="exportData()">تصدير نسخة احتياطية</button></section>'}
let backupNotice=db.settings.backupNotice||{message:'',file:''};function showBackupNotice(message,file){backupNotice={message,file};db.settings=db.settings||{};db.settings.backupNotice=backupNotice;save();let el=document.getElementById('backupNotice');if(el)el.innerHTML='<div class="item"><div><b class="good">'+message+'</b><div class="muted">الملف: '+file+'</div></div></div>';alert(message+'\\nالملف: '+file);}function backupSaved(name){showBackupNotice('تم حفظ النسخة الاحتياطية في مجلد التنزيلات',name);alert('تم حفظ النسخة الاحتياطية بنجاح في مجلد التنزيلات باسم: '+name);}
function backupFailed(message){alert('لم يتم حفظ النسخة الاحتياطية: '+message);}
function exportData(){try{if(!window.AndroidBackup||!AndroidBackup.save){alert('ميزة الحفظ غير متاحة في هذه النسخة. حدّث التطبيق إلى آخر إصدار.');return;}let stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19),name='Makhzani-Backup-'+stamp+'.json',payload={app:'Makhzani',version:3,createdAt:new Date().toISOString(),merchant:merchantAuth?.merchant||'',data:db},json=JSON.stringify(payload,null,2),base64=btoa(unescape(encodeURIComponent(json)));AndroidBackup.save(name,base64);}catch(err){console.error('Backup export error:',err);backupFailed(err&&err.message?err.message:'حدث خطأ غير معروف أثناء إنشاء النسخة');}}function extraPurchases(){let po=db.products.map((p,i)=>'<option value="'+i+'">'+p.name+' (المتاح '+p.qty+')</option>').join(''),so=db.suppliers.map((x,i)=>'<option value="'+i+'">'+x.name+'</option>').join('');return formPage('تسجيل فاتورة شراء','أدخل الصنف والكمية وسعر الشراء. ستُضاف الكمية تلقائياً إلى المخزون.','<div><label>الصنف</label><select name="productIndex" required><option value="">اختر الصنف</option>'+po+'</select></div><div><label>المورد</label><select name="supplierIndex"><option value="">بدون تحديد مورد</option>'+so+'</select></div>'+field('qty','الكمية المشتراة','number')+field('unitCost','سعر شراء الوحدة','number')+field('date','تاريخ الشراء','date')+field('note','رقم الفاتورة / ملاحظات'),'حفظ فاتورة الشراء')+'<section class="panel"><h2>سجل فواتير المشتريات</h2><div class="muted">عدد الفواتير: '+db.purchases.length+'</div>'+(db.purchases.slice().reverse().map(x=>'<div class="item"><div><b>'+x.productName+'</b><div class="muted">المورد: '+(x.supplierName||'غير محدد')+' • '+(x.date||'')+' • الكمية: '+x.qty+'</div><div class="muted">'+(x.note||'')+'</div></div><b>'+money(x.total)+'</b></div>').join('')||'<div class="empty">لا توجد فواتير مشتريات بعد</div>')+'</section>';}
function extraCash(){let ins=db.cash.filter(x=>x.type==='قبض').reduce((a,x)=>a+x.amount,0),outs=db.cash.filter(x=>x.type==='صرف'||x.type==='شراء بضاعة'||x.type==='مصروف').reduce((a,x)=>a+x.amount,0);return '<section class="panel"><h2>الصندوق اليومي</h2><div class="cards"><div class="card"><small>المقبوضات</small><div class="num">'+money(ins)+'</div></div><div class="card"><small>المدفوعات</small><div class="num">'+money(outs)+'</div></div><div class="card"><small>الرصيد</small><div class="num">'+money(ins-outs)+'</div></div></div>'+formPage('حركة نقدية','سجل حركة قبض أو صرف.', '<div><label>نوع الحركة</label><select name="type"><option>قبض</option><option>صرف</option></select></div>'+field('amount','المبلغ','number')+field('detail','البيان')+field('date','التاريخ','date'),'حفظ الحركة')+'</section><section class="panel"><h2>سجل الصندوق</h2>'+list(db.cash)+'</section>';}
function extraSettings(){return '<section class="panel"><h2>حساب التاجر</h2><p>الحساب الحالي: <b>'+(merchantAuth?.merchant||'')+'</b></p><div class="actions"><button onclick="switchAccount()">التبديل إلى حساب آخر</button><button onclick="authScreen(\'register\')">إضافة حساب جديد</button><button class="danger" onclick="logoutMerchant()">تسجيل الخروج</button></div><p class="muted">الحسابات منفصلة محلياً على هذا الهاتف.</p></section><section class="panel"><h2>النسخ الاحتياطي والحماية</h2><p>صدّر نسخة من بياناتك واحفظها خارج الهاتف، ويمكنك استعادتها لاحقاً.</p><div class="actions"><button onclick="exportData()">تصدير نسخة احتياطية</button><button onclick="document.getElementById(\'restoreFile\').click()">استعادة نسخة</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"></div><form id="pinForm">'+field('pin','رمز PIN من 4 إلى 8 أرقام','password')+'<div class="wide"><button>حفظ رمز PIN</button></div></form><p class="muted">رمز PIN محفوظ محلياً على هذا الجهاز. احتفظ بكلمة المرور ولا تشاركها.</p></section><section class="panel"><h2>حالة النسخ الاحتياطي والاستعادة</h2><div id="backupNotice">'+(backupNotice.message?'<div class="item"><div><b class="good">'+backupNotice.message+'</b><div class="muted">الملف: '+backupNotice.file+'</div></div></div>':'<div class="empty">لم تنفذ عملية نسخ أو استعادة بعد</div>')+'</div></section><section class="panel"><h2>معلومات التطبيق</h2><div class="item"><span>حفظ البيانات</span><b>محلياً على هذا الهاتف</b></div><div class="item"><span>الإنترنت</span><b>غير مطلوب</b></div></section>';}
function restoreData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let parsed=JSON.parse(rd.result),d=parsed.data&&typeof parsed.data==='object'?parsed.data:parsed,required=['products','sales','debts','suppliers','expenses'];if(!d||typeof d!=='object'||required.some(k=>!Array.isArray(d[k])))throw 0;if(!confirm('سيتم استبدال بيانات المتجر الحالية بالنسخة المحددة. هل تريد المتابعة؟'))return;db={...db,...d};for(const k of required)if(!Array.isArray(db[k]))db[k]=[];if(!Array.isArray(db.purchases))db.purchases=[];if(!Array.isArray(db.cash))db.cash=[];if(!db.settings||typeof db.settings!=='object')db.settings={};save();showBackupNotice('تم استرداد البيانات بنجاح',f.name||'ملف النسخة الاحتياطية');render();alert('تم استرداد البيانات بنجاح من الملف: '+f.name);}catch(_){alert('ملف النسخة غير صالح أو لا يحتوي على بيانات مخزني');}finally{e.target.value='';}};rd.onerror=()=>alert('تعذر قراءة الملف');rd.readAsText(f);}
function bindExtra(){let p=document.getElementById('pinForm');if(p)p.onsubmit=async e=>{e.preventDefault();let v=p.elements.pin.value;if(!/^\\d{4,8}$/.test(v)){alert('أدخل 4 إلى 8 أرقام');return;}db.settings.pinHash=await passwordDigest(v+'|'+(merchantAuth?.id||''));db.settings.pinEnabled=true;save();alert('تم تفعيل قفل PIN لهذا الحساب. سيُطلب عند تسجيل الدخول.');};}
let accounts=safeReadJSON('alsane_accounts',[]);if(!Array.isArray(accounts))accounts=[];let merchantAuth=null,merchantUnlocked=false,activeAccountId=null;
function persistAccounts(){localStorage.setItem('alsane_accounts',JSON.stringify(accounts));}
function loadAccount(account){activeAccountId=account.id;merchantAuth=account;db=safeReadJSON('alsane_db_'+account.id,{"products":[],"sales":[],"debts":[],"suppliers":[],"expenses":[],"purchases":[],"cash":[],"settings":{}});if(!db||typeof db!=='object'||Array.isArray(db))db={"products":[],"sales":[],"debts":[],"suppliers":[],"expenses":[],"purchases":[],"cash":[],"settings":{}};for(const k of ['products','sales','debts','suppliers','expenses'])if(!Array.isArray(db[k]))db[k]=[];if(!Array.isArray(db.purchases))db.purchases=[];if(!Array.isArray(db.cash))db.cash=[];db.settings=db.settings||{};backupNotice=db.settings.backupNotice||{message:'',file:''};save();}
(function migrateLegacy(){let old=safeReadJSON('alsane_merchant_auth',null);if(old&&old.merchant&&old.passwordHash&&!accounts.some(a=>a.id==='legacy')){accounts.push({id:'legacy',merchant:old.merchant,passwordHash:old.passwordHash,createdAt:new Date().toISOString()});localStorage.setItem('alsane_db_legacy',localStorage.getItem('alsane_db')||JSON.stringify(db));persistAccounts();}})();
window.addEventListener('error',function(ev){const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<section class="panel" style="margin:24px;text-align:center"><h2>تعذر تشغيل مخزني</h2><p>حدث خطأ أثناء تحميل الواجهة. أغلق التطبيق وافتحه مجدداً، وإذا استمرت المشكلة أرسل لنا إصدار أندرويد.</p></section>';console.error(ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){console.error('App error:',ev.reason);});
async function passwordDigest(v){if(window.crypto&&crypto.subtle){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}let h=2166136261;for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619);}return 'fallback-'+(h>>>0).toString(16);}
function authScreen(mode='login',msg=''){let reg=mode==='register',app=document.getElementById('app'),navEl=document.getElementById('nav');navEl.style.display='none';let accountOptions=accounts.map(a=>'<option value="'+a.id+'">'+a.merchant+'</option>').join('');app.innerHTML='<section class="panel" style="max-width:460px;margin:25px auto;padding:22px;text-align:center"><div style="font-size:46px">🏪</div><h2 style="font-size:25px">مخزني</h2><p>'+(reg?'إنشاء حساب متجر مستقل جديد':'اختر حسابك وسجّل الدخول')+'</p><h2>'+(reg?'إنشاء حساب جديد':'تسجيل الدخول')+'</h2><form id="merchantAuthForm" style="display:block;text-align:right">'+(reg?'':'<label>الحساب</label><select name="accountId" required><option value="">اختر الحساب</option>'+accountOptions+'</select>')+'<label>اسم التاجر</label><input name="merchant" required placeholder="اسم المستخدم"><label>كلمة المرور</label><input name="password" type="password" required minlength="6" placeholder="6 أحرف أو أرقام"><button style="width:100%;margin-top:8px">'+(reg?'إنشاء الحساب':'دخول')+'</button></form><p style="color:#b33">'+msg+'</p><p class="muted">'+(reg?'لديك حساب؟':'تريد إضافة حساب آخر؟')+' <a href="#" id="authSwitch">'+(reg?'تسجيل الدخول':'إنشاء حساب جديد')+'</a></p><p class="muted">كل حساب له مخزونه وبياناته وكلمة مروره المستقلة على هذا الهاتف.</p></section>';document.getElementById('authSwitch').onclick=e=>{e.preventDefault();authScreen(reg?'login':'register');};document.getElementById('merchantAuthForm').onsubmit=async e=>{e.preventDefault();let form=e.currentTarget,name=form.elements.merchant.value.trim(),password=form.elements.password.value;if(password.length<6){authScreen(mode,'كلمة المرور يجب ألا تقل عن 6 أحرف');return;}let hash=await passwordDigest(password);if(reg){if(accounts.some(a=>a.merchant.toLowerCase()===name.toLowerCase())){authScreen('register','اسم الحساب مستخدم. اختر اسماً مختلفاً.');return;}let account={id:'acc_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),merchant:name,passwordHash:hash,createdAt:new Date().toISOString()};accounts.push(account);persistAccounts();localStorage.setItem('alsane_db_'+account.id,JSON.stringify({"products":[],"sales":[],"debts":[],"suppliers":[],"expenses":[],"purchases":[],"cash":[],"settings":{}}));loadAccount(account);}else{let account=accounts.find(a=>a.id===form.elements.accountId.value&&a.merchant.toLowerCase()===name.toLowerCase());if(!account||account.passwordHash!==hash){authScreen('login','الحساب أو كلمة المرور غير صحيحة');return;}loadAccount(account);if(db.settings.pinEnabled&&db.settings.pinHash){let pin=prompt('أدخل رمز PIN لهذا الحساب');if(pin===null){authScreen('login','تم إلغاء الدخول');return;}let pinHash=await passwordDigest(pin+'|'+account.id);if(pinHash!==db.settings.pinHash){authScreen('login','رمز PIN غير صحيح');return;}}}merchantUnlocked=true;navEl.style.display='flex';page='home';render();};}
function logoutMerchant(){merchantUnlocked=false;merchantAuth=null;activeAccountId=null;authScreen(accounts.length?'login':'register');}
function switchAccount(){logoutMerchant();}

function render(){if(!merchantUnlocked){authScreen(accounts.length?'login':'register');return;}nav();let el=document.getElementById('app');el.innerHTML=page==='home'?dashboard():page==='products'?products():page==='purchases'?extraPurchases():page==='cash'?extraCash():page==='settings'?extraSettings():page==='sales'?sales():page==='debts'?debts():page==='suppliers'?suppliers():page==='editDebt'?editForm('debt'):page==='editSupplier'?editForm('supplier'):page==='payDebt'?paymentForm('debt'):page==='paySupplier'?paymentForm('supplier'):page==='expenses'?expenses():reports();let ef=document.getElementById('editEntry');if(ef){let obj=page==='editDebt'?db.debts[selectedIndex]:db.suppliers[selectedIndex];ef.elements.name.value=obj.name||'';if(ef.elements.phone)ef.elements.phone.value=obj.phone||'';ef.elements.amount.value=page==='editDebt'?obj.amount:obj.originalAmount;ef.elements.paid.value=obj.paid;ef.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(ef)),amount=Number(d.amount),paid=Number(d.paid);if(!d.name.trim()||!Number.isFinite(amount)||!Number.isFinite(paid)||amount<0||paid<0||paid>amount){alert('تحقق من الاسم والمبالغ؛ المسدد لا يمكن أن يتجاوز الإجمالي');return;}obj.name=d.name.trim();if('phone'in d)obj.phone=d.phone;obj.amount=amount;obj.originalAmount=amount;obj.paid=paid;obj.remaining=amount-paid;save();page=page==='editDebt'?'debts':'suppliers';render();alert('تم تحديث الحساب بنجاح');};}
let pf=document.getElementById('paymentEntry');if(pf){pf.elements.date.value=new Date().toISOString().slice(0,10);pf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(pf)),v=Number(d.amount),isDebt=page==='payDebt',obj=isDebt?db.debts[selectedIndex]:db.suppliers[selectedIndex];if(!Number.isFinite(v)||v<=0||v>obj.remaining){alert('أدخل مبلغاً صحيحاً لا يتجاوز الرصيد المتبقي');return;}obj.paid+=v;obj.remaining-=v;obj.payments.push({amount:v,date:d.date||new Date().toISOString().slice(0,10),type:isDebt?'قبض':'دفع'});save();page=isDebt?'debts':'suppliers';render();alert('تم تسجيل الدفعة وتحديث الرصيد');};}
if(page!=='home'){el.insertAdjacentHTML('afterbegin','<div class="backbar"><button type="button" onclick="go(\'home\')">← الرجوع إلى الرئيسية</button></div>');}
bindExtra();let f=document.getElementById('entry');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(page==='products')db.products.push({name:d.name,buy:+d.buy,sell:+d.sell,qty:+d.qty});if(page==='purchases'){let pi=Number(d.productIndex),p=db.products[pi],qty=Number(d.qty),unit=Number(d.unitCost);if(!p||!Number.isFinite(qty)||qty<=0||!Number.isFinite(unit)||unit<0){alert('اختر صنفاً وأدخل كمية وسعر شراء صحيحين');return;}let si=d.supplierIndex===''?-1:Number(d.supplierIndex),supplier=si>=0?db.suppliers[si]:null,total=qty*unit;p.qty=(Number(p.qty)||0)+qty;p.buy=unit;db.purchases.push({productName:p.name,productIndex:pi,supplierName:supplier?.name||'',supplierIndex:si,qty,unitCost:unit,total,date:d.date||new Date().toISOString().slice(0,10),note:d.note||''});if(supplier){supplier.originalAmount=(Number(supplier.originalAmount)||0)+total;supplier.amount=supplier.originalAmount;supplier.remaining=(Number(supplier.remaining)||0)+total;}}if(page==='sales')db.sales.push({name:d.name,total:+d.total,cost:+d.cost,date:d.date||new Date().toISOString().slice(0,10)});if(page==='debts'){if(+d.paid<0||+d.paid>+d.amount){alert('تحقق من المبلغ المسدد');return;}db.debts.push({name:d.name,amount:+d.amount,paid:+d.paid,remaining:+d.amount-(+d.paid),date:d.date,payments:[]});}if(page==='suppliers'){if(+d.paid<0||+d.paid>+d.amount){alert('تحقق من المبلغ المدفوع');return;}db.suppliers.push({...d,amount:+d.amount,originalAmount:+d.amount,paid:+d.paid,remaining:+d.amount-(+d.paid),payments:[]});}if(page==='expenses'){db.expenses.push({note:d.note,amount:+d.amount,date:d.date});db.cash.push({type:'مصروف',amount:+d.amount,date:d.date,detail:d.note});}if(page==='cash')db.cash.push({type:d.type,amount:+d.amount,date:d.date,detail:d.detail});save();render();alert('تم الحفظ بنجاح')}}
render();
</script></body></html>
